services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ympv}
      POSTGRES_USER: ${POSTGRES_USER:-ympv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ympv} -d ${POSTGRES_DB:-ympv}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  slskd:
    # Defaults to vanilla slskd (free search-only quality checks — see
    # services/slskd.ts). Point SLSKD_IMAGE at a modified slskd-API-compatible
    # image (agents instead of real Soulseek users, purchaser-IP gated) to
    # also enable automatic HQ download+replace — see the "auto-download"
    # toggle in Admin Settings and services/hqReplace.ts.
    image: ${SLSKD_IMAGE:-slskd/slskd:latest}
    container_name: slskd
    restart: unless-stopped
    ports:
      - "5030:5030"      # Web UI / API
      - "5031:5031"      # HTTPS UI
      - "50300:50300"    # Soulseek incoming connections
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_DOWNLOADS_DIR=/data/downloads
      - SLSKD_INCOMPLETE_DIR=/data/incomplete
      - SLSKD_SHARED_DIR=/data/shared
      # Primary API key (role=...;cidr=...;<key>) — backend authenticates its
      # better-quality search requests with the same raw <key> below via the
      # X-API-Key header (see backend's SLSKD_API_KEY and services/slskd.ts).
      - SLSKD_API_KEY=role=Administrator;cidr=0.0.0.0/0,::/0;${SLSKD_API_KEY:?SLSKD_API_KEY is required — generate via openssl rand -hex 32}
    volumes:
      - slskd_config:/app
      - music_data:/data
    networks:
      - app-net

  backend:
    # Published by .github/workflows/docker-publish.yml on every push to main/master.
    # GHCR_NAMESPACE is "owner/repo" (lowercase), e.g. yourname/youtube-music-playlist-vault
    image: ghcr.io/${GHCR_NAMESPACE:?GHCR_NAMESPACE is required, e.g. yourname/youtube-music-playlist-vault}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ympv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ympv}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      MUSIC_DIR: /data
      SLSKD_URL: http://slskd:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY:?SLSKD_API_KEY is required — generate via openssl rand -hex 32}
      AUDIO_ANALYSIS_URL: http://audio-analysis:8000
      BGUTIL_PROVIDER_URL: http://bgutil-provider:4416
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required for staging/production so signup emails can send}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-YoutubeVault <no-reply@localhost>}
    volumes:
      - music_data:/data
    depends_on:
      db:
        condition: service_healthy
      slskd:
        condition: service_started
      bgutil-provider:
        condition: service_started
      # See audio-analysis service below — deliberately not depended on here.
    networks:
      - app-net

  # Proof-of-origin token provider for yt-dlp (see backend/src/services/
  # ytdlpProcess.ts's potProviderExtractorArgs) — supplies tokens that make
  # this server's YouTube traffic look legitimate to its bot-check, which
  # otherwise increasingly blocks even the android/default player clients
  # outright once enough volume comes from one IP. No host port published —
  # only the backend needs to reach it, over app-net by service name.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    networks:
      - app-net

  audio-analysis:
    profiles: ["audio-analysis"]
    image: ghcr.io/${GHCR_NAMESPACE:?GHCR_NAMESPACE is required, e.g. yourname/youtube-music-playlist-vault}/audio-analysis:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - music_data:/data:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: ghcr.io/${GHCR_NAMESPACE:?GHCR_NAMESPACE is required, e.g. yourname/youtube-music-playlist-vault}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app-net

volumes:
  postgres_data:
  music_data:
  slskd_config:

networks:
  app-net:
    driver: bridge
